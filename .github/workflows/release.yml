name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # release the current version without pushing a tag

# Nothing to configure here: `gh release create` runs with the repository's
# automatic GITHUB_TOKEN, so there are no secrets, no environment variables and
# no npm credentials to set.
#
# This fork is distributed through GitHub Releases, not through npm - the
# upstream project published the `glmproxy` package on npm and that name is
# taken, so there is no npm publication here on purpose.
#
# What this workflow does, now that npm is gone:
#   1. a tag is only released if the tree is green (the offline suites);
#   2. the release page carries auto-generated notes and a versioned
#      download for people who do not use git.
# ci.yml covers the branches and the pull requests; this is the tag-time half.
permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Syntax checks
        run: |
          for f in lib/*.js openai.js anthropic.js main.js bin/cli.js; do
            node --check "$f" || exit 1
          done

      # The offline suites: no network, no credits, injected clock, TLS mock.
      # Identical to the required CI gate - a tag must not release a red tree.
      - name: Offline suites (no upstream)
        run: npm run test:offline

      - name: Tag must match package.json version
        if: ${{ github.event_name == 'push' }} # only tag pushes; a manual run releases whatever version is in package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json is $PKG_VERSION but tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # A manual run has no tag yet: take the version from package.json and
      # let gh create the tag on the branch that was run.
      - name: Resolve the release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" --target "$GITHUB_REF_NAME" --generate-notes --title "$TAG"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
